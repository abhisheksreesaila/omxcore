[workspace]
authors = ["Abhishek Sreesaila <abhisheksreesaila@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mxframe"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Creates the omxcore (the engine) and mxframe (its forwarding module, compat/mxframe) symlinks in site-packages.
# Run this once after `pixi install`, or if the symlinks disappear.
setup-omxcore = "ln -sfn $(pwd) .pixi/envs/default/lib/python3.12/site-packages/omxcore && ln -sfn $(pwd)/compat/mxframe .pixi/envs/default/lib/python3.12/site-packages/mxframe"

# Run any script: pixi run python scripts/my_script.py
# Run benchmarks: pixi run bench
bench      = { cmd = "python scripts/benchmark_gpu_first.py",   depends-on = ["setup-omxcore"] }
bench-tpch = { cmd = "python scripts/benchmark_tpch.py",        depends-on = ["setup-omxcore"] }
bench-utf8 = { cmd = "python scripts/benchmark_utf8_predicates.py", depends-on = ["setup-omxcore"] }
bench-weak = { cmd = "python scripts/benchmark_weak_queries.py", depends-on = ["setup-omxcore"] }
bench-all = { cmd = "python scripts/benchmark_all_22.py", depends-on = ["setup-omxcore"] }
demo       = { cmd = "python scripts/demo.py",                   depends-on = ["setup-omxcore"] }
test0    = { cmd = "python scripts/_test_phase0_compiler.py", depends-on = ["setup-omxcore"] }
test1    = { cmd = "python scripts/_test_phase1.py",          depends-on = ["setup-omxcore"] }
test4    = { cmd = "python scripts/_test_phase4.py",          depends-on = ["setup-omxcore"] }
test5    = { cmd = "python scripts/_test_phase5.py",          depends-on = ["setup-omxcore"] }
test6    = { cmd = "python scripts/_test_phase6_tpch_tier2.py", depends-on = ["setup-omxcore"] }
test6-gpu = { cmd = "MXFRAME_TEST_DEVICE=gpu python scripts/_test_phase6_tpch_tier2.py", depends-on = ["setup-omxcore"] }
test-sql  = { cmd = "python scripts/_test_phase_sql.py",         depends-on = ["setup-omxcore"] }
test-q5q10 = { cmd = "python scripts/_test_phase_q5_q10.py",    depends-on = ["setup-omxcore"] }
test-import = { cmd = "python scripts/_test_base_import.py", depends-on = ["setup-omxcore"] }
test-all = { depends-on = ["test-import", "test0", "test1", "test4", "test5", "test6", "test-sql", "test-q5q10"] }
test = "bash scripts/run_tests.sh"
mojo-test = "bash scripts/mojo_test.sh"
check-gpu = { cmd = "python scripts/_check_gpu.py",           depends-on = ["setup-omxcore"] }

[dependencies]
python = "3.12.*"
pyarrow = ">=22.0.0,<23"
modular = "26.6.*"
matplotlib = ">=3.10.8,<4"
duckdb = ">=1.4.3,<2"
nbdev = ">=2.4.10,<3"
pre-commit = ">=4.5.1,<5"
nbconvert = ">=7.17.0,<8"
pandas = ">=3.0.1,<4"
ipykernel = ">=7.1.0,<8"
pytest = ">=9.1.1,<10"
twine = ">=7.0.0,<8"
pytest-xdist = ">=3.8.0,<4"
zstd = ">=1.5.7,<2"
snappy = ">=1.2.2,<2"

[pypi-dependencies]
polars = ">=1.29, <1.35"
sqlglot = ">=28.6.0, <29"
mxframe = { path = ".", editable = true }

# patchelf edits ELF files, so it only exists for Linux (no osx-arm64 build; scripts/set_runpath.sh is Linux-only)
[target.linux-64.dependencies]
patchelf = ">=0.19.2,<0.20"
